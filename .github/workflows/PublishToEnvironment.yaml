name: ' Publish To Environment'

on:
  workflow_dispatch:
    inputs:
      appVersion:
        description: App version to deploy to environment(s) (current, prerelease, draft, latest, version number or PR_<PR Id>)
        required: false
        default: 'current'
      environmentName:
        description: Environment mask to receive the new version (* for all, PROD* for all environments starting with PROD)
        required: true
      createEnvIfNotExists:
        description: Create environment if it does not exist (use with care, yourEnvName_AuthContext yourEnvName_EnvironmentName yourEnvName_Scope must be defined as environment secrets/variables or repo secrets/variables)
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  id-token: write
  pull-requests: read
  checks: read

defaults:
  run:
    shell: powershell

env:
  ALGoOrgSettings: ${{ vars.ALGoOrgSettings }}
  ALGoRepoSettings: ${{ vars.ALGoRepoSettings }}

jobs:
  Initialization:
    needs: [ ]
    runs-on: [ windows-latest ]
    outputs:
      environmentsMatrixJson: ${{ steps.DetermineDeploymentEnvironments.outputs.EnvironmentsMatrixJson }}
      environmentCount: ${{ steps.DetermineDeploymentEnvironments.outputs.EnvironmentCount }}
      deploymentEnvironmentsJson: ${{ steps.DetermineDeploymentEnvironments.outputs.DeploymentEnvironmentsJson }}
      deviceCode: ${{ steps.Authenticate.outputs.deviceCode }}
      telemetryScopeJson: ${{ steps.init.outputs.telemetryScopeJson }}
    steps:
      - name: Dump Workflow Information
        uses: microsoft/AL-Go-Actions/DumpWorkflowInfo@v9.2
        with:
          shell: powershell

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize the workflow
        id: init
        uses: microsoft/AL-Go-Actions/WorkflowInitialize@v9.2
        with:
          shell: powershell

      - name: Read settings
        id: ReadSettings
        uses: microsoft/AL-Go-Actions/ReadSettings@v9.2
        with:
          shell: powershell

      - name: Determine Deployment Environments
        id: DetermineDeploymentEnvironments
        uses: microsoft/AL-Go-Actions/DetermineDeploymentEnvironments@v9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          shell: powershell
          getEnvironments: ${{ github.event.inputs.environmentName }}
          type: 'Publish'
          createEnvIfNotExists: ${{ github.event.inputs.createEnvIfNotExists }}

      - name: EnvName
        id: envName
        if: steps.DetermineDeploymentEnvironments.outputs.UnknownEnvironment == 1
        run: |
          $errorActionPreference = "Stop"; $ProgressPreference = "SilentlyContinue"; Set-StrictMode -Version 2.0
          $envName = '${{ fromJson(steps.DetermineDeploymentEnvironments.outputs.environmentsMatrixJson).matrix.include[0].environment }}'.split(' ')[0]
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "envName=$envName"

      - name: Read secrets
        id: ReadSecrets
        uses: microsoft/AL-Go-Actions/ReadSecrets@v9.2
        if: steps.DetermineDeploymentEnvironments.outputs.UnknownEnvironment == 1
        with:
          shell: powershell
          gitHubSecrets: ${{ toJson(secrets) }}
          getSecrets: '${{ steps.envName.outputs.envName }}-AuthContext,${{ steps.envName.outputs.envName }}_AuthContext,AuthContext'

      - name: Authenticate
        id: Authenticate
        if: steps.DetermineDeploymentEnvironments.outputs.UnknownEnvironment == 1
        run: |
          $envName = '${{ steps.envName.outputs.envName }}'
          $secretName = ''
          $secrets = '${{ steps.ReadSecrets.outputs.Secrets }}' | ConvertFrom-Json
          $authContext = $null
          "$($envName)-AuthContext", "$($envName)_AuthContext", "AuthContext" | ForEach-Object {
            if (!($authContext)) {
              if ($secrets."$_") {
                Write-Host "Using $_ secret as AuthContext"
                $authContext = $secrets."$_"
                $secretName = $_
              }
            }
          }
          if ($authContext) {
            Write-Host "AuthContext provided in secret $secretName!"
            Add-Content -Encoding UTF8 -path $ENV:GITHUB_STEP_SUMMARY -value "AuthContext was provided in a secret called $secretName. Using this information for authentication."
          }
          else {
            Write-Host "No AuthContext provided for $envName, initiating Device Code flow"
            $ALGoHelperPath = "$([System.IO.Path]::GetTempFileName()).ps1"
            $webClient = New-Object System.Net.WebClient
            $webClient.DownloadFile('https://raw.githubusercontent.com/microsoft/AL-Go-Actions/v9.2/AL-Go-Helper.ps1', $ALGoHelperPath)
            . $ALGoHelperPath
            DownloadAndImportBcContainerHelper
            $authContext = New-BcAuthContext -includeDeviceLogin -deviceLoginTimeout ([TimeSpan]::FromSeconds(0))
            Add-Content -Encoding UTF8 -path $ENV:GITHUB_STEP_SUMMARY -value "AL-Go needs access to the Business Central Environment $('${{ steps.envName.outputs.envName }}'.Split(' ')[0]) and could not locate a secret called ${{ steps.envName.outputs.envName }}_AuthContext`n`n$($authContext.message)"
            Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "deviceCode=$($authContext.deviceCode)"
          }

  Deploy:
    needs: [ Initialization ]
    if: needs.Initialization.outputs.environmentCount > 0
    strategy: ${{ fromJson(needs.Initialization.outputs.environmentsMatrixJson) }}
    runs-on: ${{ fromJson(matrix.os) }}
    name: Deploy to ${{ matrix.environment }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    environment:
      name: ${{ matrix.environment }}
      url: ${{ steps.Deploy.outputs.environmentUrl }}
    env:
      deviceCode: ${{ needs.Initialization.outputs.deviceCode }}
      ALGoEnvSettings: ${{ vars.ALGoEnvironmentSettings }}
      ALGoEnvName: ${{ matrix.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: EnvName
        id: envName
        run: |
          $errorActionPreference = "Stop"; $ProgressPreference = "SilentlyContinue"; Set-StrictMode -Version 2.0
          $envName = '${{ matrix.environment }}'.split(' ')[0]
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "envName=$envName"

      - name: Read settings
        uses: microsoft/AL-Go-Actions/ReadSettings@v9.2
        with:
          shell: ${{ matrix.shell }}
          get: type,powerPlatformSolutionFolder

      - name: Read secrets
        id: ReadSecrets
        uses: microsoft/AL-Go-Actions/ReadSecrets@v9.2
        with:
          shell: ${{ matrix.shell }}
          gitHubSecrets: ${{ toJson(secrets) }}
          getSecrets: '${{ steps.envName.outputs.envName }}-AuthContext,${{ steps.envName.outputs.envName }}_AuthContext,AuthContext'

      - name: Get Artifacts for deployment
        uses: microsoft/AL-Go-Actions/GetArtifactsForDeployment@v9.2
        with:
          shell: ${{ matrix.shell }}
          artifactsVersion: ${{ github.event.inputs.appVersion }}
          artifactsFolder: '.artifacts'
          buildMode: ${{ matrix.buildMode }}

      - name: Deploy to Business Central
        id: Deploy
        uses: microsoft/AL-Go-Actions/Deploy@v9.2
        env:
          Secrets: '${{ steps.ReadSecrets.outputs.Secrets }}'
        with:
          shell: ${{ matrix.shell }}
          environmentName: ${{ matrix.environment }}
          artifactsFolder: '.artifacts'
          type: 'Publish'
          deploymentEnvironmentsJson: ${{ needs.Initialization.outputs.deploymentEnvironmentsJson }}
          artifactsVersion: ${{ github.event.inputs.appVersion }}

      - name: Deploy to Power Platform
        if: env.type == 'PTE' && env.powerPlatformSolutionFolder != ''
        uses: microsoft/AL-Go-Actions/DeployPowerPlatform@v9.2
        env:
          Secrets: '${{ steps.ReadSecrets.outputs.Secrets }}'
        with:
          shell: ${{ matrix.shell }}
          environmentName: ${{ matrix.environment }}
          artifactsFolder: '.artifacts'
          deploymentEnvironmentsJson: ${{ needs.Initialization.outputs.deploymentEnvironmentsJson }}


  CustomJobTagDeployment:
    name: Tag deployment and post changelog
    needs: [ Initialization, Deploy ]
    if: (!cancelled()) && (needs.Deploy.result != 'skipped')
    runs-on: [ windows-latest ]
    permissions:
      contents: write
      actions: read
    outputs:
      deployments: ${{ steps.tag.outputs.deployments }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Determine Build Mode
        id: buildMode
        shell: pwsh
        run: |
          $buildMode = ('${{ needs.Initialization.outputs.environmentsMatrixJson }}' | ConvertFrom-Json).matrix.include |
              Select-Object -First 1 -ExpandProperty buildMode
          Write-Host "Resolved buildMode: $buildMode"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "buildMode=$buildMode"

      - name: Get Artifacts for deployment
        uses: microsoft/AL-Go-Actions/GetArtifactsForDeployment@v9.0
        with:
          shell: powershell
          artifactsVersion: ${{ github.event.inputs.appVersion }}
          artifactsFolder: '.artifacts'
          buildMode: ${{ steps.buildMode.outputs.buildMode }}

      - name: Tag deployments and post changelog
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $errorActionPreference = "Stop"

          $version = Get-ChildItem '.artifacts' -Directory |
              ForEach-Object { if ($_.Name -match 'Apps-(\d+\.\d+\.\d+\.\d+)$') { $Matches[1] } } |
              Select-Object -First 1

          if (-not $version) {
              Write-Host "::warning::No versioned artifact found in .artifacts — skipping deployment tags."
              exit 0
          }

          # Only tag environments whose Deploy matrix leg succeeded (others may have failed)
          # The jobs API can lag behind the job results: when the Deploy matrix reports success, retry before giving up
          $deployOk = '${{ needs.Deploy.result }}' -eq 'success'
          for ($try = 1; $try -le 6; $try++) {
              $environments = @(gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/jobs?per_page=100" --paginate `
                      --jq '.jobs[] | select((.name | startswith("Deploy to ")) and .conclusion == "success") | .name' |
                  ForEach-Object { $_.Substring('Deploy to '.Length).Split(' ')[0] })
              if ($environments -or -not $deployOk) { break }
              Write-Host "Deploy reported success but no successful Deploy job visible yet (attempt $try) — retrying in 10s."
              Start-Sleep -Seconds 10
          }

          if (-not $environments) {
              # Fail loudly when Deploy succeeded, otherwise Notify Teams has no tags to report
              if ($deployOk) { Write-Host "::error::Deploy succeeded but no successful Deploy job found — no deployment tags created."; exit 1 }
              Write-Host "::warning::No successful deployments — skipping deployment tags."
              exit 0
          }

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          $deployments = @()
          foreach ($envName in $environments) {
              $newTag = "deployed/$envName/$version"

              # Existing tags of this environment, newest first; the previous deployment is the newest one that is not this tag
              $existingTags = @(gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/deployed/$envName/" --paginate --jq '.[].ref' |
                  ForEach-Object { $_ -replace '^refs/tags/', '' } |
                  Sort-Object -Descending)
              $previousTag = $existingTags | Where-Object { $_ -ne $newTag } | Select-Object -First 1

              if ($existingTags -contains $newTag) {
                  Write-Host "Tag $newTag already exists — not recreating it."
              }
              else {
                  git tag $newTag
                  git push origin $newTag
                  if ($LASTEXITCODE -ne 0) { throw "Could not push tag $newTag" }
                  Write-Host "Created tag: $newTag"
              }

              if ($previousTag) {
                  $compareUrl  = "https://github.com/$env:GITHUB_REPOSITORY/compare/$previousTag...$newTag"
                  $comparison  = gh api "repos/$env:GITHUB_REPOSITORY/compare/$previousTag...$newTag" | ConvertFrom-Json
                  # Skip merge commits (2+ parents, they only repeat the commits they merge) and the automatic changelog commits
                  $commits = @($comparison.commits | Where-Object { $_.parents.Count -lt 2 -and $_.commit.message -notmatch '^docs: update changelog' } | ForEach-Object {
                      [pscustomobject]@{ sha = $_.sha; message = $_.commit.message.Split("`n")[0].Trim() }
                  })
                  $previousVersion = $previousTag.Substring("deployed/$envName/".Length)
                  $commitLines = @($commits | ForEach-Object { "- ``$($_.sha.Substring(0,7))`` $($_.message)" })
                  if (-not $commitLines) { $commitLines = @("_(no code changes between these versions)_") }
              }
              else {
                  $compareUrl      = "https://github.com/$env:GITHUB_REPOSITORY/commits/$newTag"
                  $commits         = @()
                  $previousVersion = "First deployment"
                  $commitLines     = @("_(no previous deployment tag found — this is the first tracked deployment)_")
              }

              # Handed to Notify Teams through a job output: capped at 50 commits per environment to stay well below the size limits
              $deployments += [pscustomobject]@{
                  environment     = $envName
                  version         = $version
                  tag             = $newTag
                  previousVersion = $previousVersion
                  compareUrl      = $compareUrl
                  commitCount     = $commits.Count
                  commits         = @($commits | Select-Object -First 50)
              }

              $summary = @"
          ## Deployment to ``$envName`` — version ``$version``

          | | |
          |---|---|
          | **Environment** | ``$envName`` |
          | **Version deployed** | ``$version`` |
          | **Previous version** | ``$previousVersion`` |
          | **Full diff** | [Compare on GitHub]($compareUrl) |

          ### Commits included in this deployment
          $($commitLines -join "`n")
          "@
              $summary | Add-Content -Path $env:GITHUB_STEP_SUMMARY
              Write-Host $summary
          }

          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "deployments=$(ConvertTo-Json -InputObject $deployments -Compress -Depth 5)"

  CustomJobNotifyTeams:
    name: Notify Teams
    needs: [ Deploy, CustomJobTagDeployment ]
    if: (!cancelled()) && (needs.Deploy.result != 'skipped')
    permissions:
      contents: read
      actions: read
      checks: read
      deployments: read
    uses: ./.github/workflows/notify-teams-after-publish.yml
    with:
      deployments: ${{ needs.CustomJobTagDeployment.outputs.deployments }}
    secrets: inherit

  PostProcess:
    needs: [ Initialization, Deploy, CustomJobTagDeployment ]
    if: always()
    runs-on: [ windows-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Finalize the workflow
        id: PostProcess
        uses: microsoft/AL-Go-Actions/WorkflowPostProcess@v9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          shell: powershell
          telemetryScopeJson: ${{ needs.Initialization.outputs.telemetryScopeJson }}
          currentJobContext: ${{ toJson(job) }}
