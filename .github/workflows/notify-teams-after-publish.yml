name: Notify Teams After Publish

# Called as a job from PublishToEnvironment.yaml (CustomJobNotifyTeams), so it runs in the same
# workflow run, also when some environments failed
on:
  workflow_call:
    inputs:
      deployments:
        description: JSON array from the tag job (environment, version, tag, previousVersion, compareUrl, commitCount, commits)
        type: string
        required: true

permissions:
  contents: read
  actions: read
  checks: read
  deployments: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Collect deployment info
        id: deployment
        uses: actions/github-script@v7
        env:
          DEPLOYMENTS: ${{ inputs.deployments }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = context.runId;
            const commitSha = context.sha;

            // Deployments (environment, version, tag, changelog) are produced by the tag job
            const deployments = JSON.parse(process.env.DEPLOYMENTS || '[]');
            if (deployments.length === 0) {
              core.setFailed("The tag job reported no deployments. The deployment may not have completed successfully.");
              return;
            }

            // Locate app.json case-insensitively (repos use App.json or app.json, possibly in a subfolder); prefer the shallowest
            const tree = await github.rest.git.getTree({ owner, repo, tree_sha: commitSha, recursive: 'true' });
            const appPath = tree.data.tree
              .map(t => t.path)
              .filter(p => /(^|\/)app\.json$/i.test(p))
              .sort((a, b) => a.split('/').length - b.split('/').length)[0];
            let appName = repo;
            if (appPath) {
              const appFile = await github.rest.repos.getContent({ owner, repo, path: appPath, ref: commitSha });
              appName = JSON.parse(Buffer.from(appFile.data.content, 'base64').toString()).name;
            } else {
              console.log(`No app.json found at ${commitSha}, falling back to repo name`);
            }

            // Environments whose Deploy matrix leg did not succeed, with link to the job and its error
            // Environments the tag job reported as deployed are never failed, whatever the jobs API shows
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { owner, repo, run_id: runId });
            const envOf = j => j.name.slice('Deploy to '.length).split(' ')[0];
            const failedEnvs = [];
            for (const j of jobs.filter(j => j.name.startsWith('Deploy to ') && j.conclusion !== 'success' && !deployments.some(d => d.environment === envOf(j)))) {
              let error = `Job ${j.conclusion}`;
              try {
                const annotations = (await github.rest.checks.listAnnotations({ owner, repo, check_run_id: j.id })).data
                  .filter(a => a.annotation_level === 'failure');
                // Prefer the real error over the generic "Process completed with exit code 1."
                const best = annotations.find(a => !/^Process completed with exit code/.test(a.message)) || annotations[0];
                if (best) error = best.message.length > 300 ? best.message.slice(0, 300) + '…' : best.message;
              } catch (e) {
                console.log(`Could not read annotations for ${j.name}: ${e.message}`);
              }
              failedEnvs.push({ environment: envOf(j), url: j.html_url, error });
            }

            // Business Central URL per environment, from the GitHub deployment created by the Deploy job
            const ghDeployments = await github.rest.repos.listDeployments({ owner, repo, sha: commitSha, per_page: 100 });
            for (const dep of deployments) {
              const d = ghDeployments.data.find(d => d.environment.split(' ')[0] === dep.environment); // newest first
              if (!d) continue;
              const statuses = await github.rest.repos.listDeploymentStatuses({ owner, repo, deployment_id: d.id, per_page: 1 });
              dep.environmentUrl = statuses.data[0]?.environment_url || '';
            }

            core.setOutput("failed_environments", JSON.stringify(failedEnvs));
            core.setOutput("deployments", JSON.stringify(deployments));
            core.setOutput("version", deployments[0].version);
            core.setOutput("app_name", appName);

      - name: Post changelog to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          DEPLOYMENTS: ${{ steps.deployment.outputs.deployments }}
          FAILED_ENVIRONMENTS: ${{ steps.deployment.outputs.failed_environments }}
          APP_VERSION: ${{ steps.deployment.outputs.version }}
          APP_NAME: ${{ steps.deployment.outputs.app_name }}
          RELEASED_BY: ${{ github.triggering_actor }}
          RELEASED_BY_URL: ${{ github.server_url }}/${{ github.triggering_actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Create Adaptive Card payload using python
          python3 - << 'PY' > /tmp/teams-payload.json
          import json, os, re

          repo_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"

          # Split a commit message into TextRuns, turning #123 into a link to PR 123
          def msg_runs(text):
            runs = []
            for i, part in enumerate(re.split(r'(?<![\w/])#(\d+)\b', text)):
              if i % 2:
                runs.append({"type": "TextRun", "text": f"#{part}", "color": "Accent",
                             "selectAction": {"type": "Action.OpenUrl", "url": f"{repo_url}/pull/{part}"}})
              elif part:
                runs.append({"type": "TextRun", "text": part, "isSubtle": True})
            return runs
          
          changelogs = json.loads(os.environ['DEPLOYMENTS'])
          failed_envs = json.loads(os.environ.get('FAILED_ENVIRONMENTS') or '[]')

          # Build body sections for each environment
          body_sections = [
            {
              "type": "TextBlock",
              "text": "⚠️ Deployment Partially Failed" if failed_envs else "✅ Deployment Completed",
              "weight": "Bolder",
              "size": "Large",
              "color": "Warning" if failed_envs else "Good"
            },
            {
              "type": "FactSet",
              "facts": [
                {
                  "title": "App:",
                  "value": os.environ['APP_NAME']
                },
                {
                  "title": "App Version:",
                  "value": os.environ['APP_VERSION']
                },
                {
                  "title": "Environments:",
                  "value": ", ".join(c['environment'] for c in changelogs)
                },
                {
                  "title": "Released by:",
                  "value": f"[{os.environ['RELEASED_BY']}]({os.environ['RELEASED_BY_URL']})"
                },
                {
                  "title": "Workflow run:",
                  "value": f"[View workflow]({os.environ['RUN_URL']})"
                }
              ]
            }
          ]
          if failed_envs:
            body_sections[1]["facts"].insert(3, {"title": "Failed Environments:",
                                                 "value": ", ".join(f["environment"] for f in failed_envs)})

          # One block per failed environment: error message + link to the failing job
          for failed in failed_envs:
            body_sections += [
              {
                "type": "TextBlock",
                "text": f"❌ Environment: {failed['environment']} (failed)",
                "weight": "Bolder",
                "size": "Medium",
                "color": "Attention",
                "separator": True
              },
              {
                "type": "TextBlock",
                "text": failed['error'],
                "wrap": True,
                "isSubtle": True,
                "spacing": "Small"
              },
              {
                "type": "TextBlock",
                "text": f"[View failing job]({failed['url']})",
                "spacing": "Small"
              }
            ]

          # Environments with the same version, previous version and commits share one block,
          # so a deployment to many environments stays well below the Teams message size limit (~28 KB)
          groups = {}
          for changelog in changelogs:
            key = (changelog['version'], changelog['previousVersion'], changelog['commitCount'],
                   tuple(c['sha'] for c in changelog['commits']))
            groups.setdefault(key, []).append(changelog)

          def group_blocks(group, max_commits):
            first = group[0]
            prev_version = first['previousVersion']
            env_names = ", ".join(c['environment'] for c in group)
            blocks = [
              {
                "type": "TextBlock",
                "text": f"{'Environments' if len(group) > 1 else 'Environment'}: {env_names}",
                "weight": "Bolder",
                "size": "Medium",
                "wrap": True,
                "separator": True
              },
              {
                "type": "FactSet",
                "facts": [
                  {"title": "Current Version:", "value": first['version']},
                  {"title": "Previous Version:", "value": prev_version}
                ]
              }
            ]

            links = [f"[{c['environment']}]({c['environmentUrl']})" for c in group if c.get('environmentUrl')]
            if links:
              blocks.append({
                "type": "TextBlock",
                "text": "Open in Business Central: " + " · ".join(links),
                "wrap": True,
                "spacing": "Small"
              })

            blocks.append({
              "type": "TextBlock",
              "text": "Commits:",
              "weight": "Bolder",
              "spacing": "Medium",
              "size": "Small"
            })

            # One RichTextBlock per commit for proper inline link rendering
            shown_commits = first['commits'][:max_commits]
            for commit in shown_commits:
              clean_msg = commit.get('message', '').replace('\n', ' ').replace('\r', '').strip()
              inlines = [
                {"type": "TextRun", "text": commit['sha'][:7],
                 "selectAction": {"type": "Action.OpenUrl", "url": f"{repo_url}/commit/{commit['sha']}"},
                 "color": "Accent", "isSubtle": False},
              ] + msg_runs(f"  {clean_msg}")
              blocks.append({"type": "RichTextBlock", "inlines": inlines, "spacing": "Small"})

            more = first['commitCount'] - len(shown_commits)
            if more > 0:
              text = f"... and {more} more commits"
            elif first['commitCount'] == 0:
              text = "Initial deployment - no previous version to compare" if prev_version == "First deployment" else "No commits found"
            else:
              text = None
            if text:
              blocks.append({"type": "TextBlock", "text": text, "wrap": True, "isSubtle": True, "spacing": "Small"})
            return blocks

          def build_payload(max_commits):
            body = list(body_sections)
            for group in groups.values():
              body += group_blocks(group, max_commits)
            return {
              "type": "message",
              "attachments": [
                {
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "content": {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    "type": "AdaptiveCard",
                    "version": "1.4",
                    "body": body,
                    "actions": [
                      {
                        "type": "Action.OpenUrl",
                        "title": "View Workflow Run",
                        "url": os.environ['RUN_URL']
                      }
                    ]
                  }
                }
              ]
            }

          # Teams accepts the webhook (HTTP 202) but silently drops oversized cards: shrink the commit lists until it fits
          for max_commits in (10, 3, 0):
            payload = build_payload(max_commits)
            if len(json.dumps(payload).encode()) <= 24000:
              break
          print(json.dumps(payload))
          PY

          echo "::group::Teams Webhook Details"
          echo "Endpoint: $TEAMS_WEBHOOK_URL"
          echo "Method: POST"
          echo "Content-Type: application/json"
          echo "::endgroup::"

          echo "::group::JSON Payload"
          cat /tmp/teams-payload.json
          echo ""
          echo "::endgroup::"

          echo "::group::Sending to Teams..."
          # Send to Teams and capture response
          CURL_EXIT=0
          HTTP_CODE=$(curl -w "%{http_code}" -o /tmp/teams-response.txt \
            -X POST \
            -H "Content-Type: application/json" \
            -d @/tmp/teams-payload.json \
            "$TEAMS_WEBHOOK_URL" 2>/tmp/teams-error.txt) || CURL_EXIT=$?
          
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::❌ curl command failed with exit code ${CURL_EXIT}"
            if [ -s /tmp/teams-error.txt ]; then
              echo "Error details:"
              cat /tmp/teams-error.txt
            fi
            exit 1
          fi
          
          # Validate HTTP_CODE is non-empty and numeric
          if [ -z "$HTTP_CODE" ] || ! [[ "$HTTP_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::❌ Invalid HTTP status code: '${HTTP_CODE:-empty}'"
            exit 1
          fi
          
          echo "HTTP Status Code: $HTTP_CODE"
          echo "Response Body:"
          cat /tmp/teams-response.txt
          echo ""
          echo "::endgroup::"

          # Check if the request was successful
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Successfully posted to Teams (HTTP $HTTP_CODE)"
          else
            echo "::error::❌ Failed to post to Teams (HTTP $HTTP_CODE)"
            exit 1
          fi
