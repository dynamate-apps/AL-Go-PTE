name: Notify Teams After Publish

# Called as a job from PublishToEnvironment.yaml (CustomJobNotifyTeams), so it runs in the same
# workflow run, also when some environments failed
on:
  workflow_call:
    inputs:
      deployments:
        description: JSON array from the tag job (environment, version, tag, previousVersion, compareUrl, commitCount, commits)
        type: string
        required: true

permissions:
  contents: read
  actions: read
  checks: read
  deployments: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Collect deployment info
        id: deployment
        uses: actions/github-script@v7
        env:
          DEPLOYMENTS: ${{ inputs.deployments }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = context.runId;
            const commitSha = context.sha;

            // Deployments (environment, version, tag, changelog) are produced by the tag job
            const deployments = JSON.parse(process.env.DEPLOYMENTS || '[]');
            if (deployments.length === 0) {
              core.setFailed("The tag job reported no deployments. The deployment may not have completed successfully.");
              return;
            }

            // Locate app.json case-insensitively (repos use App.json or app.json, possibly in a subfolder); prefer the shallowest
            const tree = await github.rest.git.getTree({ owner, repo, tree_sha: commitSha, recursive: 'true' });
            const appPath = tree.data.tree
              .map(t => t.path)
              .filter(p => /(^|\/)app\.json$/i.test(p))
              .sort((a, b) => a.split('/').length - b.split('/').length)[0];
            let appName = repo;
            if (appPath) {
              const appFile = await github.rest.repos.getContent({ owner, repo, path: appPath, ref: commitSha });
              appName = JSON.parse(Buffer.from(appFile.data.content, 'base64').toString()).name;
            } else {
              console.log(`No app.json found at ${commitSha}, falling back to repo name`);
            }

            // Environments whose Deploy matrix leg did not succeed, with link to the job and its error
            // Environments the tag job reported as deployed are never failed, whatever the jobs API shows
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { owner, repo, run_id: runId });
            const envOf = j => j.name.slice('Deploy to '.length).split(' ')[0];
            const failedEnvs = [];
            for (const j of jobs.filter(j => j.name.startsWith('Deploy to ') && j.conclusion !== 'success' && !deployments.some(d => d.environment === envOf(j)))) {
              let error = `Job ${j.conclusion}`;
              try {
                const annotations = (await github.rest.checks.listAnnotations({ owner, repo, check_run_id: j.id })).data
                  .filter(a => a.annotation_level === 'failure');
                // Prefer the real error over the generic "Process completed with exit code 1."
                const best = annotations.find(a => !/^Process completed with exit code/.test(a.message)) || annotations[0];
                if (best) error = best.message.length > 300 ? best.message.slice(0, 300) + '…' : best.message;
              } catch (e) {
                console.log(`Could not read annotations for ${j.name}: ${e.message}`);
              }
              failedEnvs.push({ environment: envOf(j), url: j.html_url, error });
            }

            // Business Central URL per environment, from the GitHub deployment created by the Deploy job
            const ghDeployments = await github.rest.repos.listDeployments({ owner, repo, sha: commitSha, per_page: 100 });
            for (const dep of deployments) {
              const d = ghDeployments.data.find(d => d.environment.split(' ')[0] === dep.environment); // newest first
              if (!d) continue;
              const statuses = await github.rest.repos.listDeploymentStatuses({ owner, repo, deployment_id: d.id, per_page: 1 });
              dep.environmentUrl = statuses.data[0]?.environment_url || '';
            }

            core.setOutput("failed_environments", JSON.stringify(failedEnvs));
            core.setOutput("deployments", JSON.stringify(deployments));
            core.setOutput("app_name", appName);

      - name: Post changelog to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          DEPLOYMENTS: ${{ steps.deployment.outputs.deployments }}
          FAILED_ENVIRONMENTS: ${{ steps.deployment.outputs.failed_environments }}
          APP_NAME: ${{ steps.deployment.outputs.app_name }}
          RELEASED_BY: ${{ github.triggering_actor }}
          RELEASED_BY_URL: ${{ github.server_url }}/${{ github.triggering_actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # One Adaptive Card per environment: a single card for many environments exceeds the 28 KB Teams message limit
          rm -f /tmp/teams-card-*.json
          python3 - << 'PY'
          import json, os, re

          repo_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
          run_url = os.environ['RUN_URL']
          released_by = f"[{os.environ['RELEASED_BY']}]({os.environ['RELEASED_BY_URL']})"

          # Split a commit message into TextRuns, turning #123 into a link to PR 123
          def msg_runs(text):
            runs = []
            for i, part in enumerate(re.split(r'(?<![\w/])#(\d+)\b', text)):
              if i % 2:
                runs.append({"type": "TextRun", "text": f"#{part}", "color": "Accent",
                             "selectAction": {"type": "Action.OpenUrl", "url": f"{repo_url}/pull/{part}"}})
              elif part:
                runs.append({"type": "TextRun", "text": part, "isSubtle": True})
            return runs

          def title(text, color):
            return {"type": "TextBlock", "text": text, "weight": "Bolder", "size": "Large", "color": color, "wrap": True}

          def facts(*pairs):
            return {"type": "FactSet", "facts": [{"title": t, "value": v} for t, v in pairs]}

          def card(body):
            return {
              "type": "message",
              "attachments": [{
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.4",
                  "body": body,
                  "actions": [{"type": "Action.OpenUrl", "title": "View Workflow Run", "url": run_url}]
                }
              }]
            }

          cards = []

          def deployment_card(d, max_commits):
            prev_version = d['previousVersion']
            body = [
              title(f"✅ Deployed to {d['environment']}", "Good"),
              facts(("App:", os.environ['APP_NAME']),
                    ("Version:", d['version']),
                    ("Previous Version:", prev_version),
                    ("Released by:", released_by)),
            ]
            if d.get('environmentUrl'):
              body.append({"type": "ActionSet", "actions": [{"type": "Action.OpenUrl", "title": "Open in Business Central",
                                                              "url": d['environmentUrl']}]})
            body.append({"type": "TextBlock", "text": "Commits:", "weight": "Bolder", "spacing": "Medium", "size": "Small"})

            # One RichTextBlock per commit for proper inline link rendering
            shown = d['commits'][:max_commits]
            for commit in shown:
              clean_msg = commit.get('message', '').replace(chr(10), ' ').replace(chr(13), '').strip()
              inlines = [
                {"type": "TextRun", "text": commit['sha'][:7],
                 "selectAction": {"type": "Action.OpenUrl", "url": f"{repo_url}/commit/{commit['sha']}"},
                 "color": "Accent", "isSubtle": False},
              ] + msg_runs(f"  {clean_msg}")
              body.append({"type": "RichTextBlock", "inlines": inlines, "spacing": "Small"})

            more = d['commitCount'] - len(shown)
            if more > 0:
              note = f"... and {more} more commits"
            elif d['commitCount'] == 0:
              note = "Initial deployment - no previous version to compare" if prev_version == "First deployment" else "No commits found"
            else:
              note = None
            if note:
              body.append({"type": "TextBlock", "text": note, "wrap": True, "isSubtle": True, "spacing": "Small"})
            body.append({"type": "TextBlock", "text": f"[Full diff on GitHub]({d['compareUrl']})", "spacing": "Small"})
            return card(body)

          for d in json.loads(os.environ['DEPLOYMENTS']):
            # Show every commit, unless the card would get close to the 28 KB Teams message limit
            shown = len(d['commits'])
            c = deployment_card(d, shown)
            while len(json.dumps(c).encode()) > 24000 and shown > 0:
              shown = shown * 3 // 4
              c = deployment_card(d, shown)
            cards.append(c)

          # One card per failed environment: error message + link to the failing job
          for failed in json.loads(os.environ.get('FAILED_ENVIRONMENTS') or '[]'):
            cards.append(card([
              title(f"❌ Deployment to {failed['environment']} failed", "Attention"),
              facts(("App:", os.environ['APP_NAME']), ("Released by:", released_by)),
              {"type": "TextBlock", "text": failed['error'], "wrap": True, "isSubtle": True, "spacing": "Small"},
              {"type": "TextBlock", "text": f"[View failing job]({failed['url']})", "spacing": "Small"},
            ]))

          for i, c in enumerate(cards):
            with open(f"/tmp/teams-card-{i:02d}.json", "w", encoding="utf-8") as f:
              json.dump(c, f)
          PY

          FAILED=0
          SENT=0
          for CARD in /tmp/teams-card-*.json; do
            BYTES=$(wc -c < "$CARD")
            echo "::group::Posting $(basename "$CARD") (${BYTES} bytes)"
            # Teams limits a message to 28 KB
            if [ "$BYTES" -gt 28000 ]; then
              echo "::warning::$(basename "$CARD") is ${BYTES} bytes, over the 28 KB Teams message limit; Teams may drop it"
            fi
            cat "$CARD"
            echo ""

            # Teams throttles a webhook at 4 requests per second: pause between cards, retry on HTTP 429
            if [ "$SENT" -gt 0 ]; then sleep 2; fi
            SENT=$((SENT + 1))

            CURL_EXIT=0
            for ATTEMPT in 1 2 3; do
              HTTP_CODE=$(curl -sS -w "%{http_code}" -o /tmp/teams-response.txt \
                -X POST \
                -H "Content-Type: application/json" \
                -d @"$CARD" \
                "$TEAMS_WEBHOOK_URL" 2>/tmp/teams-error.txt) || CURL_EXIT=$?
              if [ "$CURL_EXIT" -ne 0 ] || [ "$HTTP_CODE" != "429" ]; then break; fi
              echo "HTTP 429, retrying in 10s (attempt ${ATTEMPT})"
              sleep 10
            done

            if [ "$CURL_EXIT" -ne 0 ]; then
              echo "::error::curl failed with exit code ${CURL_EXIT} for $(basename "$CARD")"
              cat /tmp/teams-error.txt
              FAILED=$((FAILED + 1))
            else
              echo "HTTP Status Code: $HTTP_CODE"
              echo "Response Body:"
              cat /tmp/teams-response.txt
              echo ""
              if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
                echo "Posted $(basename "$CARD") to Teams (HTTP $HTTP_CODE)"
              else
                echo "::error::Failed to post $(basename "$CARD") to Teams (HTTP $HTTP_CODE)"
                FAILED=$((FAILED + 1))
              fi
            fi
            echo "::endgroup::"
          done

          if [ "$FAILED" -gt 0 ]; then
            echo "::error::${FAILED} of ${SENT} Teams cards could not be posted"
            exit 1
          fi
